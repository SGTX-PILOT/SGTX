<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061">
        <animate attributeName="stop-color" values="#f5d061;#ffe9a8;#d4a017;#f5d061" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#d4a017">
        <animate attributeName="stop-color" values="#d4a017;#f5d061;#b8860b;#d4a017" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#b8860b">
        <animate attributeName="stop-color" values="#b8860b;#d4a017;#8b6914;#b8860b" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform-origin="64 64">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="14s" repeatCount="indefinite" />
    <circle cx="64" cy="64" r="60" fill="none" stroke="#d4a017" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="3 6" />
  </g>
  <g transform-origin="64 64">
    <animateTransform attributeName="transform" type="rotate" from="360 64 64" to="0 64 64" dur="10s" repeatCount="indefinite" />
    <circle cx="64" cy="64" r="55" fill="none" stroke="#f5d061" stroke-width="0.6" stroke-opacity="0.25" stroke-dasharray="1 4" />
  </g>
  <g filter="url(#glow)">
    <polygon points="64,10 110,37 110,91 64,118 18,91 18,37" fill="url(#goldGrad)" stroke="#8b6914" stroke-width="1.2" stroke-linejoin="round">
      <animate attributeName="stroke-opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="64,22 99,42 99,86 64,106 29,86 29,42" fill="url(#innerGrad)" stroke="#8b6914" stroke-width="0.6" stroke-opacity="0.4" stroke-linejoin="round" />
    <g stroke="#3d2806" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <animate attributeName="opacity" values="0.7;0.95;0.7" dur="3s" repeatCount="indefinite" />
      <path d="M 78 44 Q 78 36 70 36 L 58 36 Q 50 36 50 44 Q 50 52 58 52 L 70 52 Q 78 52 78 60 Q 78 68 70 68 L 58 68 Q 50 68 50 76 Q 50 84 58 84 L 70 84 Q 78 84 78 76" />
    </g>
    <circle cx="64" cy="64" r="2.5" fill="#3d2806" opacity="0.6">
      <animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  <g transform-origin="64 64">
    <animateTransform attributeName="transform" type="rotate" from="0 64 64" to="360 64 64" dur="6s" repeatCount="indefinite" />
    <circle cx="64" cy="14" r="1.8" fill="#f5d061">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="114" cy="64" r="1.4" fill="#d4a017" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="64" cy="114" r="1.6" fill="#f5d061" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="1.5s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="14" cy="64" r="1.2" fill="#d4a017" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="1.5s" begin="0.3s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
