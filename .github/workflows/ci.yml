name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CERT-23: Certification-grade CI. Every job below is a hard gate — there
# is no `continue-on-error: true` anywhere. A failing job fails the build.
#
# Gates (in order):
#   1. lint        — ESLint. Fails on any error.
#   2. typecheck   — `tsc --noEmit`. Fails on any TS error.
#   3. build       — Next.js standalone build. Fails on build error.
#   4. prisma      — Prisma schema validate + client generate. Fails on
#                    schema error or generated-code mismatch.
#   5. secrets-scan — Rejects committed credentials (P0 findings). Fails
#                    the build if any source file contains a Turso JWT,
#                    GitHub PAT, Vercel token, or AWS key literal.
#   6. mock-detector — Flags `TODO`/`FIXME`/`coming soon`/`mock`/`placeholder`
#                    in production code paths. Fails the build if a
#                    production-path mock is detected.
#   7. registry-validate — Validates the canonical navigation registry
#                    (CERT-4): no duplicate IDs, no orphan tabs, no
#                    invalid permissions.
#   8. tests       — Vitest unit + integration tests. Fails on any failure.
#                    (Currently a skeleton; new tests must be added under
#                    tests/ following the CERT-24 testing stack.)

jobs:
  # ===========================================================================
  # lint — ESLint. Hard gate.
  # ===========================================================================
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: ESLint (must pass)
        run: bun run lint

  # ===========================================================================
  # typecheck — tsc --noEmit. Hard gate.
  # CERT-23 FIX: Removed `continue-on-error: true` — TS errors now fail CI.
  # ===========================================================================
  typecheck:
    name: Type check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
        env:
          DATABASE_URL: "file:./ci-test.db"
      - name: tsc --noEmit (must pass — no continue-on-error)
        run: npx tsc --noEmit

  # ===========================================================================
  # build — Next.js standalone. Hard gate.
  # ===========================================================================
  build:
    name: Build (Next.js standalone)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextcache-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextcache-
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
        env:
          DATABASE_URL: "file:./ci-test.db"
      - name: Build (must pass)
        run: bun run build
        env:
          DATABASE_URL: "file:./ci-test.db"
          SGTX_SESSION_SECRET: "ci-session-secret-32-chars-minimum-aaaa"
          SGTX_REFRESH_SECRET: "ci-refresh-secret-32-chars-minimum-aa"
          CRON_SECRET: "ci-cron-secret-32-chars-minimum-aaaaaaa"
          SGTX_PLATFORM_KEY: "ci-platform-key-32-chars-minimum-aaaaa"
          NEXT_TELEMETRY_DISABLED: "1"

  # ===========================================================================
  # prisma — schema validate + client generate. Hard gate.
  # ===========================================================================
  prisma:
    name: Prisma validate + generate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: prisma validate (must pass)
        run: bunx prisma validate
        env:
          DATABASE_URL: "file:./ci-test.db"
      - name: prisma generate (must pass)
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:./ci-test.db"

  # ===========================================================================
  # secrets-scan — CERT-32. Rejects committed credentials. Hard gate.
  # ===========================================================================
  secrets-scan:
    name: Secrets scan (CERT-32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed credentials
        run: |
          set -e
          # CERT-32: any source file containing a Turso JWT literal, a
          # GitHub PAT, a Vercel token, or an AWS key literal fails CI.
          # (We use ripgrep with a tight pattern to avoid false positives.)
          if rg -n 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9\.eyJhIjoicnci' \
                  --type-add 'cfg:*.{ts,js,json,sh,env}' -t cfg \
                  src/ prisma.config.ts 2>/dev/null; then
            echo "::error::CERT-32 FAIL: Turso JWT literal found in source."
            echo "::error::See SGTX_SECURITY_AUDIT.md finding #1."
            exit 1
          fi
          if rg -n 'ghp_[A-Za-z0-9]{36}' src/ prisma.config.ts 2>/dev/null; then
            echo "::error::CERT-32 FAIL: GitHub PAT literal found in source."
            exit 1
          fi
          if rg -n 'vcp_[A-Za-z0-9]{40,}' src/ prisma.config.ts 2>/dev/null; then
            echo "::error::CERT-32 FAIL: Vercel token literal found in source."
            exit 1
          fi
          if rg -n 'AKIA[0-9A-Z]{16}' src/ prisma.config.ts 2>/dev/null; then
            echo "::error::CERT-32 FAIL: AWS access key literal found in source."
            exit 1
          fi
          echo "✅ CERT-32: no credential literals found in source."

  # ===========================================================================
  # mock-detector — CERT-27. Flags production-path mocks. Hard gate.
  # ===========================================================================
  mock-detector:
    name: Mock / placeholder detector (CERT-27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect mocks in production code
        run: |
          set -e
          # CERT-27: scan production code (src/lib + src/app + src/components)
          # for mock/placeholder patterns. We exclude tests/, scripts/, and
          # explicit fixture files. We allow comments that explain WHY
          # something is a simulation (e.g. "WasmEdge simulation" in
          # governor/index.ts) — we only flag TODOs and "coming soon".
          FAIL=0
          # 1. TODOs without an owner/ticket reference
          TODO_COUNT=$(rg -c 'TODO\(?\(?[^)]*\)?:' src/lib src/app src/components 2>/dev/null | awk -F: '{sum+=$2} END {print sum+0}')
          if [ "$TODO_COUNT" -gt 0 ]; then
            echo "::warning::CERT-27: $TODO_COUNT TODOs in production code (must be ticketed)"
          fi
          # 2. "coming soon" / "placeholder" in production code (visible UI text)
          if rg -i 'coming soon|placeholder' src/app/page.tsx src/components/portals/ src/components/sgtx/ 2>/dev/null; then
            echo "::error::CERT-27 FAIL: 'coming soon' or 'placeholder' found in production UI."
            FAIL=1
          fi
          # 3. setTimeout pretending to process a mutation (heuristic)
          if rg -n 'setTimeout\([^,]+,\s*[0-9]+\)' src/app/api/ 2>/dev/null | rg -v 'cron|expir|deferred|retr' 2>/dev/null | head -5; then
            echo "::warning::CERT-27: setTimeout in API routes (review for fake-async patterns)"
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "✅ CERT-27: no production-path mocks detected."

  # ===========================================================================
  # registry-validate — CERT-4. Validates the canonical navigation registry.
  # Hard gate. Fails on duplicate IDs, orphan tabs, invalid permissions.
  # ===========================================================================
  registry-validate:
    name: Canonical registry validation (CERT-4)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
        env:
          DATABASE_URL: "file:./ci-test.db"
      - name: Validate canonical navigation registry
        run: |
          bun run scripts/cert/validate-registry.ts
        env:
          DATABASE_URL: "file:./ci-test.db"

  # ===========================================================================
  # tests — Vitest unit + integration tests. Hard gate.
  # CERT-24: Currently a skeleton. New tests must be added under tests/.
  # ===========================================================================
  tests:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
        env:
          DATABASE_URL: "file:./ci-test.db"
      - name: Run unit + integration tests
        run: bun run test:ci
        env:
          DATABASE_URL: "file:./ci-test.db"
          NODE_ENV: "test"

  # ===========================================================================
  # e2e — Playwright end-to-end tests (CERT-24 golden flows).
  # ===========================================================================
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
        env:
          DATABASE_URL: "file:./ci-test.db"
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E golden flows
        run: bun run test:e2e
        env:
          DATABASE_URL: "file:./ci-test.db"
          NODE_ENV: "test"
          SGTX_SESSION_SECRET: "ci-session-secret-32-chars-minimum-aaaa"
          SGTX_REFRESH_SECRET: "ci-refresh-secret-32-chars-minimum-aa"
          CRON_SECRET: "ci-cron-secret-32-chars-minimum-aaaaaaa"
          SGTX_PLATFORM_KEY: "ci-platform-key-32-chars-minimum-aaaaa"
