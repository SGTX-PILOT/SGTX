[workspace]
resolver = "2"
members = [
    # Phase 1 — Infrastructure
    "crates/sgtx-brain-core",
    "crates/sgtx-brain-kernel",
    "crates/sgtx-brain-runtime",
    "crates/sgtx-brain-loader",
    "crates/sgtx-brain-eventbus",
    "crates/sgtx-brain-registries",
    "crates/sgtx-brain-managers",
    "crates/sgtx-brain-infra",
    # Phase 2 — Executive Cortex
    "crates/sgtx-brain-cortex",
    # Phase 3 — Memory Architecture
    "crates/sgtx-brain-memory",
    # Phase 4 — Knowledge Graph
    "crates/sgtx-brain-knowledge",
    # Phase 5 — Agent OS
    "crates/sgtx-brain-agents",
    # Binary
    "crates/sgtx-brain-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["SGTX Platform"]
repository = "https://github.com/sgtx/brain"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Web / API
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "metrics"] }
hyper = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = "1.0"
bytes = "1.7"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "ipnetwork"] }
pgvector = { version = "0.4", features = ["sqlx", "postgres"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Messaging
async-nats = "0.38"

# Observability
prometheus = "0.13"
opentelemetry = "0.26"
opentelemetry-otlp = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
tracing = "0.1"
tracing-opentelemetry = "0.27"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
ulid = { version = "1.1", features = ["serde"] }

# Crypto
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["serde"] }
rand = "0.8"

# Config
config = "0.14"
figment = { version = "0.10", features = ["toml", "env"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"
crossbeam = "0.8"
flume = "0.11"

# Utilities
once_cell = "1.20"
regex = "1.10"
url = "2.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
